00_签约与委托/委托代理协议: 当事人与律所之间的委托代理合同 / 法律服务协议 / 聘请律师协议。
00_签约与委托/授权委托书: 当事人(委托人)授权律师代理诉讼的授权委托书。⚠注意：司法鉴定委托书/鉴定委托 不归这里，归 06_专家工作/司法鉴定。
00_签约与委托/利益冲突检索: 利益冲突检查/冲突检索记录。
00_签约与委托/主体信息: 当事人主体资格材料：营业执照、身份证、工商内档、公司章程、统一社会信用代码等。
00_签约与委托/报价方案: 律师费报价、收费方案。
00_签约与委托/接案笔录: 首次会面、接案笔录、初步咨询、案情说明。
00_签约与委托/案件大事记: 案件时间轴、大事记、事件年表、进展梳理。
01_案件资料/事实梳理: 梳理案件【发生了什么事】：事实经过、时间顺序、案情概述。只讲客观事实，不含法律分析、不含我方打法策略。
01_案件资料/现场勘验: 现场勘验/勘察全流程材料：勘验通知书、现场照片、勘察记录、勘验笔录、勘验报告。⚠正式司法鉴定归 06；可视化演示材料归 05_庭审/庭前准备/可视化材料。
01_案件资料/客户提供材料/合同文件: 客户提供、作为案件背景的实体交易合同（购销/服务/租赁/股权等）。⚠若作为正式证据提交，归 03_证据。
01_案件资料/客户提供材料/往来函件: 当事人之间的商务往来信函、邮件、律师函（背景材料）。⚠法院发来的函件归 04_诉讼文书/法院来文。
01_案件资料/客户提供材料/技术文件: 产品规格、图纸、说明书、技术标准、操作手册等技术资料。
01_案件资料/客户提供材料/财务文件: 银行流水、对账单、财务报表、账户明细等财务资料。
01_案件资料/客户提供材料/录音录像: 录音、录像、监控视频、通话录音等音视频材料。
01_案件资料/客户提供材料/行政文件: 行政机关出具的批文、许可、处罚决定、行政答复等。
02_法律研究/研究备忘录: 对【法律问题】的客观研究：法律意见书、法律备忘录、法律适用分析、尽职调查报告（讲法律怎么适用，区别于我方打法策略）。
02_法律研究/法律法规: 法律法规、司法解释、部门规章、规范性文件汇编。
02_法律研究/类案检索: 类案/判例检索报告、裁判规则、参考案例分析。
03_证据/电子数据: 作为证据的电子数据：微信/短信聊天记录、电子邮件、电子合同、网页截图等。
03_证据/证人陈述: 证人证言、证人证词、证人陈述书。
03_证据/证据交换记录: 庭前证据交换笔录 / 举证质证交换记录。
03_证据/质证意见/过程稿: 我方对证据'三性'发表的质证意见、质证意见书（我方撰写）。
04_诉讼文书/起诉状/过程稿: 原告(我方)启动诉讼、列明诉讼请求与事实理由的起诉状。
04_诉讼文书/答辩状/过程稿: 被告方针对起诉作出回应的答辩状。
04_诉讼文书/反诉状/过程稿: 被告对原告提起反诉的反诉状。
04_诉讼文书/上诉状/过程稿: 不服一审判决/裁定、向上级法院提起上诉的上诉状。
04_诉讼文书/再审申请书/过程稿: 申请再审的再审申请书、申诉书。
04_诉讼文书/代理词/过程稿: 庭审中我方发表的代理意见 / 代理词 / 辩论意见。
04_诉讼文书/保全申请/过程稿: 财产保全、证据保全、先予执行申请书。
04_诉讼文书/程序申请/过程稿: 程序性申请书：管辖权异议、回避、延期举证、调查取证令、追加当事人、证人出庭等。含：对司法鉴定意见书提出异议的申请书（'关于鉴定意见异议'类文书）。
04_诉讼文书/申请书/过程稿: 其它申请书（兜底用）。⚠保全申请→保全申请；管辖异议/回避/调查取证/延期举证等→程序申请；⚠【鉴定申请书】→06_专家工作/司法鉴定，不归这里。
04_诉讼文书/法院来文: 法院/仲裁机构发来的【程序性】来文：传票、开庭/受理/应诉/举证通知书、决定书。⚠判决书、裁定书等【裁判文书】不归这里，归 08_判决与执行；⚠我方撰写的诉讼文书也不归这里。
04_诉讼文书/送达文件: 送达回证、公告送达、邮寄送达凭证等送达类材料。含：EMS单/邮单/快递单/挂号信回执/签收记录（凡与诉讼送达相关的邮件凭证均归此处）。⚠
  邮单/EMS单/快递单不是差旅费用，不归 11_账单与工时/差旅费用。
05_庭审/庭前准备/庭审提纲/过程稿: 庭审提纲、发问提纲、举证质证提纲（庭前准备，我方撰写）。
05_庭审/庭前准备/可视化材料: 庭审演示 PPT、示意图、时间轴图、可视化展示材料。⚠ 现场勘验通知/勘验笔录/勘察记录不归这里，归 01_案件资料/现场勘验；法院通知不归这里，归
  04_诉讼文书/法院来文。
05_庭审/庭审记录/律师自记笔录: 庭审过程中律师自己记录的笔录、庭审摘要。
06_专家工作/司法鉴定: 司法鉴定全流程材料：【鉴定申请书】、鉴定委托书、送鉴材料、鉴定意见书、补充/重新鉴定。凡是'鉴定'相关的（含鉴定申请书）都归这里，不归
  04_诉讼文书/申请书。⚠ 当事人自委托的技术咨询/失效分析→06_专家工作/技术分析；对鉴定意见提出异议的申请书→04_诉讼文书/程序申请。
06_专家工作/技术分析: 技术分析报告、失效分析、专家咨询意见（非正式司法鉴定）。
06_专家工作/专家辅助人: 专家辅助人（专家证人）意见、出庭说明。
07_和解与调解/和解方案/过程稿: 双方协商或达成的和解协议 / 和解方案（当事人之间）。
07_和解与调解/调解申请: 申请法院/调解组织主持调解的调解申请书。
07_和解与调解/调解笔录: 调解过程笔录、调解协议、调解书草案。
08_判决与执行/判决书: 法院作出的【裁判文书】：一审/二审民事判决书、裁定书。凡是'判决书/裁定书'都归这里（不归法院来文）。
08_判决与执行/上诉文件: 二审阶段的上诉相关材料汇总。
08_判决与执行/执行申请书/过程稿: 强制执行申请书。
08_判决与执行/执行异议: 执行异议申请书、案外人执行异议、执行异议之诉。
08_判决与执行/执行文件: 执行通知书、执行裁定书、执行过程其他文件。
09_跨境协作/翻译文件: 中外文译文、翻译件、认证翻译（原文的翻译版本）。
09_跨境协作/外国法证明: 外国法查明、外国法专家意见、域外法律证明。
09_跨境协作/外国律师协作: 与外国律师/境外律所的协作往来、协作意见。
09_跨境协作/送达与司法协助: 涉外/跨境送达、海牙取证、司法协助请求等。
09_跨境协作/法律意见书跨境版/过程稿: 出具给境外客户/用于跨境的法律意见书。
09_跨境协作/境外诉讼仲裁: 境外平行诉讼/仲裁的相关材料。
10_客户沟通/会议纪要: 与客户开会的会议纪要、议事录。
10_客户沟通/阶段汇报: 【发给客户】的阶段性进展汇报、案件报告、办案小结（对客户的沟通文件；区别于内部的事实梳理/策略）。
10_客户沟通/风险提示: 向客户出具的风险提示、风险评估函。
10_客户沟通/邮件摘要: 对收到的往来邮件的整理/摘要（不是起草外发邮件）。
10_客户沟通/往来邮件/我方拟发/过程稿: 我方正在起草、准备外发的邮件草稿。
10_客户沟通/往来邮件/收发存档: 已发送/已收到的邮件留档。
11_账单与工时/账单记录: 律师费账单、收费记录、发票。
11_账单与工时/工时记录: 律师工时记录、计时单。
11_账单与工时/差旅费用: 差旅、报销、办案费用单据（交通费、住宿费、差旅报销单）。⚠ 邮单/EMS单/快递单/签收记录不在此处，应归 04_诉讼文书/送达文件。
12_内部工作文件/案件策略/过程稿: 我方【打法/策略】：诉讼策略分析、攻防思路、举证/鉴定时机的内部讨论（讲'我方该怎么打'，不对外；区别于客观的法律研究和事实梳理）。
12_内部工作文件/工作日志: 办案工作日志、内部进展记录。
12_内部工作文件/模板与格式: 文书模板、格式范本。
12_内部工作文件/费用预算: 诉讼费用预算、成本测算。
13_结案归档/内部归档: 结案后内部归档材料、案件总结。
13_结案归档/客户交付: 结案后向客户交付的成果文件包。
00_Engagement/Party Information: Client and opposing party profiles, corporate registration
  records, org charts. ⚠ Do NOT put engagement letters or conflict checks here.
00_Engagement/Conflict Check: Conflict check records, conflict reports, conflict waiver
  letters.
00_Engagement/Engagement Agreement: Engagement letters, retainer agreements, fee agreements,
  amendments to engagement.
00_Engagement/Proposal & Pitch: Fee proposals, billing rate schedules, preliminary
  case assessment memos.
00_Engagement/Authorization: Authorization to retain counsel, powers of attorney.
00_Engagement/Intake Notes: Intake notes from initial client consultation, first meeting
  notes.
01_Case Materials/Fact Analysis: Chronology of events, timeline, case background memo,
  issue list. Contains WHAT happened — pure facts, no legal strategy.
01_Case Materials/Client-Provided Materials/Contracts & Agreements: Background contracts
  provided by client (purchase agreement, NDA, SOW). ⚠ If submitted as trial exhibit,
  store in 03 or 04 Pretrial/Exhibit folders.
01_Case Materials/Client-Provided Materials/Correspondence: Pre-litigation business
  correspondence, demand letters, cease-and-desist, termination notices. ⚠ Attorney-client
  communications go to 12_Client Communications.
01_Case Materials/Client-Provided Materials/Technical Documents: Technical specs,
  test reports, inspection reports, acceptance certificates provided by client.
01_Case Materials/Attorney-Gathered Materials/Corporate Records: SEC filings (10-K/10-Q),
  Articles of Incorporation, UCC lien filings gathered by attorney.
01_Case Materials/Attorney-Gathered Materials/Evidence: Witness statements, declarations/affidavits,
  site photos, financial records gathered by attorney.
01_Case Materials/Site Inspection: Site visit notes, inspection report, field notes.
02_Legal Research/Case Chronology: Litigation milestones log, docket entries timeline
  — tracks what procedural events have occurred.
02_Legal Research/Statutes & Case Law: Federal/state statutes, CFR, FRCP, case law
  opinions (F.3d, F.Supp), local rules, standing orders.
02_Legal Research/Research Memos: Internal legal memos, risk/damages assessment, likelihood
  of success analysis. ⚠ Not strategy — objective analysis.
02_Legal Research/Case Law Search: Westlaw/Lexis research reports, precedent analysis,
  circuit split surveys.
03_Opposing Party Filings/Pleadings/Complaint: Complaint filed BY opposing party (when
  opposing party is plaintiff). ⚠ OUR complaint goes to 04_Our Filings/Pleadings/Complaint.
03_Opposing Party Filings/Pleadings/Answer: Opposing party's answer to our complaint
  (when we are plaintiff). ⚠ Our answer goes to 04.
03_Opposing Party Filings/Pleadings/Counterclaim: Opposing party's counterclaim, crossclaim,
  or third-party complaint. ⚠ Our counterclaim → 04.
03_Opposing Party Filings/Pleadings/Amended Pleading: Opposing party's amended complaint
  or supplemental pleading.
03_Opposing Party Filings/Motions & Briefs/Motion Papers: Opposing party's notice
  of motion + supporting declarations/affidavits. ⚠ Our motion papers → 04.
03_Opposing Party Filings/Motions & Briefs/Memorandum in Support: Opposing party's
  memorandum of law in support of their motion.
03_Opposing Party Filings/Motions & Briefs/Opposition Brief: Opposing party's opposition/response
  to OUR motion. ⚠ Our opposition → 04.
03_Opposing Party Filings/Motions & Briefs/Reply Brief: Opposing party's reply brief
  in support of their own motion. ⚠ Our reply → 04.
03_Opposing Party Filings/Discovery Responses/Initial Disclosures: Opposing party's
  Rule 26(a)(1) initial disclosures. ⚠ Our disclosures → 04_Our Filings/Discovery
  — Sent/.
03_Opposing Party Filings/Discovery Responses/Interrogatory Responses: Opposing party's
  answers/responses to our interrogatories.
03_Opposing Party Filings/Discovery Responses/RFP Responses: Opposing party's responses
  to our requests for production; bates-stamped productions.
03_Opposing Party Filings/Discovery Responses/RFA Responses: Opposing party's responses
  to our requests for admission.
03_Opposing Party Filings/Discovery Responses/Privilege Log: Opposing party's privilege
  log filed with court. ⚠ Master privilege log (internal) → 05_Discovery & Doc Review/Document
  Review/Privilege Log (Master).
03_Opposing Party Filings/Pretrial Submissions/Pretrial Memorandum: Opposing party's
  trial brief or pretrial memorandum.
03_Opposing Party Filings/Pretrial Submissions/Exhibit List: Opposing party's trial
  exhibit list. ⚠ Our exhibit list → 04.
03_Opposing Party Filings/Pretrial Submissions/Witness List: Opposing party's witness
  list. ⚠ Our witness list → 04.
03_Opposing Party Filings/Pretrial Submissions/Motions in Limine: Opposing party's
  motions in limine / Daubert motions.
04_Our Filings/Pleadings/Complaint: OUR complaint (when we are plaintiff). ⚠ Opposing
  party's complaint → 03.
04_Our Filings/Pleadings/Answer: OUR answer and affirmative defenses. ⚠ Opposing answer
  → 03.
04_Our Filings/Pleadings/Counterclaim: OUR counterclaim or crossclaim.
04_Our Filings/Pleadings/Amended Pleading: OUR amended complaint or pleading.
04_Our Filings/Motions & Briefs/Motion Papers: 'OUR notice of motion + supporting
  declarations. Common motions: MTD (12(b)(6)), MSJ (Rule 56), TRO/PI, motion to compel.'
04_Our Filings/Motions & Briefs/Memorandum in Support: OUR memorandum of law in support
  of our motion.
04_Our Filings/Motions & Briefs/Opposition Brief: OUR opposition/response to opposing
  party's motion.
04_Our Filings/Motions & Briefs/Reply Brief: OUR reply brief in support of our own
  motion.
04_Our Filings/Discovery — Sent/Initial Disclosures: OUR Rule 26(a)(1) initial disclosures
  sent to opposing party. ⚠ Expert disclosures (Rule 26(a)(2)) → 06_Experts/Our Experts/Qualifications
  & CV.
04_Our Filings/Discovery — Sent/Interrogatories: OUR interrogatories served on opposing
  party.
04_Our Filings/Discovery — Sent/Requests for Production (RFPs): OUR requests for production
  of documents served on opposing party.
04_Our Filings/Discovery — Sent/Requests for Admission (RFAs): OUR requests for admission
  served on opposing party.
04_Our Filings/Discovery — Responses/Interrogatory Responses: OUR responses/answers
  to opposing party's interrogatories.
04_Our Filings/Discovery — Responses/RFP Responses: OUR responses to opposing party's
  requests for production; our production.
04_Our Filings/Discovery — Responses/RFA Responses: OUR responses to opposing party's
  requests for admission.
04_Our Filings/Discovery — Responses/Privilege Log: OUR privilege log filed with court.
  ⚠ Master privilege log maintained during review → 05_Discovery & Doc Review/Document
  Review/Privilege Log (Master).
04_Our Filings/Pretrial Submissions/Pretrial Memorandum: OUR trial brief or pretrial
  memorandum.
04_Our Filings/Pretrial Submissions/Exhibit List: OUR trial exhibit list. ⚠ Opposing
  exhibit list → 03.
04_Our Filings/Pretrial Submissions/Witness List: OUR witness list. ⚠ Opposing witness
  list → 03.
04_Our Filings/Pretrial Submissions/Motions in Limine: OUR motions in limine or Daubert
  motions.
05_Discovery & Doc Review/Legal Hold/Hold Notice: 'Litigation hold / legal hold notice
  sent to client employees: preserve all relevant ESI and hard-copy documents.'
05_Discovery & Doc Review/Legal Hold/Custodian Acknowledgment: Signed acknowledgments
  from employees confirming receipt of litigation hold.
05_Discovery & Doc Review/Document Collection/Collection Log: ESI collection log,
  forensic collection report, data source list.
05_Discovery & Doc Review/Document Collection/Custodian List: List of key employee
  custodians whose files were collected.
05_Discovery & Doc Review/Document Review/Review Protocol: Document review coding
  manual, responsiveness criteria, review guidelines.
05_Discovery & Doc Review/Document Review/Privilege Log (Master): Master privilege
  log maintained centrally during review. ⚠ Party-specific logs filed with court →
  03 or 04 Privilege Log folders.
05_Discovery & Doc Review/Document Review/Hot Documents: Hot documents list, key emails,
  smoking gun documents, critical evidence identified during review.
05_Discovery & Doc Review/Depositions/Notice of Deposition: Notice of deposition (Rule
  30), 30(b)(6) notice, deposition subpoenas. ⚠ Deposition transcript → Deposition
  Transcript folder.
05_Discovery & Doc Review/Depositions/Deposition Outline: Deposition preparation outline,
  examination questions, witness prep notes.
05_Discovery & Doc Review/Depositions/Deposition Transcript: Certified deposition
  transcript, rough transcript, errata sheet.
05_Discovery & Doc Review/Depositions/Deposition Summary: Attorney-prepared summary
  of deposition transcript, key testimony digest.
06_Experts/Our Experts/Qualifications & CV: Our expert's CV, qualifications, and Rule
  26(a)(2) expert disclosure. ⚠ Expert report itself → Expert Report folder.
06_Experts/Our Experts/Expert Report: OUR expert's opening/initial expert report.
  ⚠ Rebuttal → Rebuttal Report folder. Opposing expert → 06/Opposing Experts.
06_Experts/Our Experts/Rebuttal Report: OUR expert's rebuttal/reply report responding
  to opposing expert's opening report.
06_Experts/Our Experts/Expert Deposition Transcript: Deposition transcript of OUR
  expert witness.
06_Experts/Opposing Experts/Qualifications & CV: Opposing expert's CV and Rule 26(a)(2)
  disclosure. ⚠ Use to assess Daubert challenges.
06_Experts/Opposing Experts/Expert Report: Opposing expert's opening/initial expert
  report.
06_Experts/Opposing Experts/Rebuttal Report: Opposing expert's rebuttal report.
06_Experts/Opposing Experts/Expert Deposition Transcript: Deposition transcript of
  opposing expert witness.
07_Trial/Trial Preparation/Trial Outline: Trial plan, trial notebook, trial preparation
  memo — overall litigation strategy for trial.
07_Trial/Trial Preparation/Opening Statement: Opening statement draft and final version.
07_Trial/Trial Preparation/Closing Argument: Closing argument / summation draft and
  final version.
07_Trial/Trial Preparation/Jury Instructions: Proposed jury instructions, jury charge,
  verdict forms. ⚠ Jury trial only; bench trial uses trial brief.
07_Trial/Trial Preparation/Trial Demonstratives: PowerPoint/slides, timeline graphics,
  charts, diagrams for use at trial.
07_Trial/Trial Record/Trial Transcript: Official trial transcript from court reporter.
  ⚠ Deposition transcripts → 05_Discovery & Doc Review.
07_Trial/Trial Record/Attorney Trial Notes: Attorney's own notes taken during trial,
  daily trial summary.
08_Court Documents/Summons & Service: Summons, proof of service, certificate of service,
  affidavit of service. Issued by court or filed to confirm service.
08_Court Documents/Hearing Notices: Court-issued notices of hearings, conferences,
  order to show cause. ⚠ Scheduling order → Case Management Order.
08_Court Documents/Case Management Order: Case management order (CMO), scheduling
  order — sets discovery cutoff, expert deadlines, trial date.
08_Court Documents/Court Orders: 'Court orders and rulings on motions: order granting/denying
  motions, TRO, preliminary injunction, standing order. ⚠ Final judgment → Judgment
  folder.'
08_Court Documents/Judgment: Final judgment, default judgment, jury verdict form.
  ⚠ Not a court order on a motion — this is the final resolution of the case.
09_Settlement/Settlement Negotiations: 'Settlement demands/offers, counter-offers
  (marked without prejudice), mediation statements, mediation briefs. ⚠ FRE 408: inadmissible
  at trial.'
09_Settlement/Settlement Agreement: Executed settlement agreement and release, confidential
  settlement agreement, mutual release.
09_Settlement/Dismissal Papers: Stipulation of dismissal (Rule 41), notice of voluntary
  dismissal, with/without prejudice.
10_Appeal/Notice of Appeal: 'Notice of appeal (FRAP 4). ⚠ Federal civil: must file
  within 30 days of judgment.'
10_Appeal/Appellate Briefs/Appellant's Brief: Appellant's opening brief (our brief
  if we appeal; opposing brief if they appeal and we cross-appeal).
10_Appeal/Appellate Briefs/Appellee's Brief: Appellee's/respondent's answering brief.
10_Appeal/Appellate Briefs/Reply Brief: Appellant's reply brief.
10_Appeal/Record on Appeal: Record on appeal, joint appendix, record excerpts.
10_Appeal/Oral Argument Materials: Oral argument outline, bench memo, moot court prep
  notes, anticipated panel questions.
11_Cross-Border/Foreign Counsel Correspondence: Correspondence with foreign/local/international
  co-counsel, foreign law opinions. ⚠ General client comms → 12_Client Communications.
11_Cross-Border/Foreign Law Opinions: Formal foreign law opinions on enforceability,
  applicable law, or Chinese law issues.
11_Cross-Border/China-Related Materials: Chinese-law documents, PRC-issued materials,
  CIETAC-related materials, certified translations (CN↔EN).
12_Client Communications/Meeting Minutes: Meeting minutes and call notes from client
  meetings. ⚠ Internal team meetings → 14_Internal Work Files.
12_Client Communications/Email Correspondence/Drafts — Outgoing: Draft outgoing emails
  to client (V0.x = drafts; Vx.0 = finalized sent version).
12_Client Communications/Email Correspondence/Sent & Received Archive: Sent/received
  email archive (.eml, .msg).
12_Client Communications/Email Summaries: Summaries/digests of email correspondence.
12_Client Communications/Status Reports: Status reports and litigation updates sent
  to client. ⚠ Internal progress notes → 14_Internal Work Files.
12_Client Communications/Strategy Memos to Client: Client-facing strategy memos. ⚠
  Internal-only strategy → 14_Internal Work Files/Case Strategy.
12_Client Communications/Document Request Lists: Lists of documents/materials requested
  from client.
13_Billing & Time/Time Records: Timesheets, time entries, billable hours records.
13_Billing & Time/Expense Reports: Expense reports, travel reimbursement requests,
  receipts.
13_Billing & Time/Invoices: Client invoices, bills, statements of account.
14_Internal Work Files/Work Log: Daily work log, task lists, pending items, internal
  notes. ⚠ Not sent to client.
14_Internal Work Files/Case Strategy: Internal case strategy, litigation plan, work
  product memos — protected under work product doctrine. ⚠ Client-facing version →
  12_Client Communications/Strategy Memos to Client.
14_Internal Work Files/Internal Emails: Internal team emails (.eml/.msg) among attorneys
  and staff.
14_Internal Work Files/Templates & Forms: Document templates, form agreements, boilerplate.
15_Case Closing/Internal Closing: Internal closing checklist, file index, closing
  memo, case summary.
15_Case Closing/Client File Transfer: File transfer to client, closing letter, return
  of original documents.
03_证据/我方证据: 我方提交的所有证据材料，包括：证据原件/复印件、证据目录/清单（只含编号名称页码的列表）。来源=ours 时归此处。
03_证据/对方证据: 对方提交的所有证据材料，包括：证据原件/复印件、证据目录/清单。来源=opposing 时归此处，不要误归我方。
